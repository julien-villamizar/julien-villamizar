        .lang-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            pointer-events: none;
        }
        .lang-btn:hover {
            border-color: #F5C84C;
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 0 15px rgba(245, 200, 76, 0.35);
        }
        .lang-btn.active {
            border-color: #F5C84C;
            box-shadow: 0 0 18px rgba(245, 200, 76, 0.55), inset 0 0 8px rgba(245, 200, 76, 0.2);

        }

            font-size: 0.9rem;

        /* === SECCIÓN LIBROS === */
        .libros-lista { padding: 10px 0; }

        .obra-item {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            padding: 18px 25px;
            background: transparent;
            border: 2px solid #F5C84C;
            border-radius: 4px;
            color: #F5C84C;
            font-family: 'Cinzel', serif;

            background: #F5C84C;
            color: #000;
            box-shadow: 0 0 40px rgba(245, 200, 76, 0.2);
            transform: scale(1.02);
        }

        .marco-contenedor {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease, opacity 0.4s ease, margin 0.3s ease;
            opacity: 0;
            margin: 0 auto;
        }
        .marco-contenedor.abierto {
            max-height: 8000px;
            opacity: 1;
            margin: 30px auto;
        }

        .marco-antiguo {
            position: relative;
            background: #0a0a0a;
            border: 8px double #F5C84C;
            border-radius: 20px 5px 20px 5px;
            padding: 40px 35px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow:
                inset 0 0 60px rgba(0,0,0,0.8),
                0 0 30px rgba(245, 200, 76, 0.1),
                0 10px 40px rgba(0,0,0,0.9);
        }
        .marco-antiguo::before,
        .marco-antiguo::after {
            content: "ᛉ";
            position: absolute;
            font-size: 2.8rem;
            color: #F5C84C;
            opacity: 0.3;
            font-family: 'MedievalSharp', cursive;
            text-shadow: 0 0 15px rgba(245, 200, 76, 0.1);
        }
        .marco-antiguo::before { top: -15px; left: 20px; }
        .marco-antiguo::after { bottom: -15px; right: 20px; }

        .marco-antiguo .runas {
            position: absolute;
            font-family: 'MedievalSharp', cursive;
            color: #F5C84C;
            font-size: 1.3rem;
            opacity: 0.2;
            pointer-events: none;
        }
        .marco-antiguo .runas.r1 { top: 15px; right: 25px; }
        .marco-antiguo .runas.r2 { bottom: 15px; left: 25px; }
        .marco-antiguo .runas.r3 { top: 50%; left: 10px; transform: translateY(-50%); }
        .marco-antiguo .runas.r4 { top: 50%; right: 10px; transform: translateY(-50%); }

        .obra-titulo {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: #F5C84C;
            text-shadow: 0 0 30px rgba(245, 200, 76, 0.1);
            margin: 10px 0 5px;
            letter-spacing: 8px;
            word-break: break-word;
        }
        .obra-autor {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            color: #ccc;
            margin-bottom: 20px;
            font-style: italic;
            letter-spacing: 1px;
        }
        .obra-fecha {
            font-family: 'Lora', serif;
            font-size: 1rem;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .obra-dedicatoria {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            color: #ddd;
            font-style: italic;
            line-height: 1.6;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 18px 0;
            margin: 20px 0;
            white-space: pre-line;
        }
        .obra-info {
            font-family: 'Lora', serif;
            font-size: 1rem;
            color: #bbb;
            line-height: 1.8;
            margin: 20px 0 30px;
            background: rgba(0,0,0,0.4);
            padding: 18px;
            border-radius: 8px;
            border-left: 3px solid #F5C84C;
            border-right: 3px solid #F5C84C;
            white-space: pre-line;
        }
        .obra-info strong { color: #F5C84C; font-weight: 700; }
        .obra-info .nota { font-style: italic; color: #999; }

        .btn-pdf {
            display: inline-block;
            background: transparent;
            color: #F5C84C;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 40px;
            border: 2px solid #F5C84C;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(245, 200, 76, 0.05);
            position: relative;
            cursor: pointer;
            background-color: rgba(0,0,0,0.3);
        }
        .btn-pdf:hover {
            background: #F5C84C;
            color: #000;
            box-shadow: 0 0 40px rgba(245, 200, 76, 0.2);
            transform: scale(1.02);
        }
        .btn-pdf::before {
            content: "";
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 2px solid #333;
            border-radius: 6px;
            opacity: 0.3;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .btn-pdf:hover::before { opacity: 0.8; }

        /* === VISOR PDF INLINE === */
        .pdf-viewer-container {
            display: none;
            margin: 30px auto 0;
            padding: 0;
            max-width: 720px;
        }
        .pdf-viewer-container.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .pdf-scroll-area {
            max-height: 80vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px 10px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            /* Deshabilitar selección de texto por completo */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            scrollbar-width: thin;
            scrollbar-color: #F5C84C #1a1a1a;
        }
        .pdf-scroll-area::-webkit-scrollbar { width: 8px; }
        .pdf-scroll-area::-webkit-scrollbar-track { background: #1a1a1a; }
        .pdf-scroll-area::-webkit-scrollbar-thumb { background: #F5C84C; border-radius: 4px; }

        .pdf-page {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-width: 100%;
            margin: 15px auto;
            border: 1px solid #333;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none; /* impide selección/arrastre */
        }

        .pdf-status {
            color: #F5C84C;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            text-align: center;
            padding: 30px 0;
            font-size: 1rem;
        }
        .pdf-error { color: #ff6b6b; }

        @media (max-width: 600px) {
            .obra-titulo { font-size: 2.2rem; letter-spacing: 4px; }
            .marco-antiguo { padding: 25px 15px; }
            .btn-pdf { font-size: 0.9rem; padding: 12px 25px; letter-spacing: 2px; }
            .marco-antiguo::before,
            .marco-antiguo::after { font-size: 2rem; }
            .marco-antiguo .runas { display: none; }
            .obra-item { font-size: 1rem; padding: 14px 20px; }
            .lang-btn { width: 36px; height: 28px; }
            .lang-switcher { gap: 6px; right: 10px; }
            nav { gap: 20px; }
        }

Il fait partie de l'anthologie « Héritages Invisibles »,
qui sera publiée par <strong>Ita Editorial</strong>.
<span class="nota">Tout commentaire ou suggestion est chaleureusement bienvenu.</span>`,
            btn_read: "Lire l'histoire",
            footer: '© 2026 Julien Villamizar Arriaga. Tous droits réservés.',
            pdf_loading: 'Chargement…',
            pdf_error: 'Le PDF n\u2019a pas pu être chargé.'
        }
    };

    /* =========================================================
       2) ESTADO Y APLICACIÓN DE IDIOMA (INSTANTÁNEO)
       ========================================================= */
    let currentLang = 'es';
    let bookOpen = false;

    function applyLanguage(lang) {
        if (!i18n[lang]) lang = 'es';
        currentLang = lang;
        const dict = i18n[lang];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (dict[key] !== undefined) el.innerHTML = dict[key];
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        document.documentElement.lang = lang;
        try { localStorage.setItem('lang', lang); } catch (e) {}

        // Refrescar el botón "Primer intento" según estado abierto/cerrado
        const btn = document.getElementById('book-toggle');
        if (btn) {
            btn.textContent = bookOpen ? dict.book_button_open : dict.book_button;
        }

        // Actualizar metadatos
        const metaDesc = document.querySelector('meta[name="description"]');
        const metaOgDesc = document.querySelector('meta[property="og:description"]');
        const desc = lang === 'es'
            ? 'Te doy la bienvenida a mi portafolio personal, donde comparto mi música, mis videojuegos y mis libros.'
            : lang === 'en'
                ? 'Welcome to my personal portfolio, where I share my music, my video games, and my books.'
                : 'Bienvenue sur mon portfolio personnel, où je partage ma musique, mes jeux vidéo et mes livres.';
        if (metaDesc) metaDesc.setAttribute('content', desc);
        if (metaOgDesc) metaOgDesc.setAttribute('content', desc);
    }

    // Listeners de banderas
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
    });

    /* =========================================================
       3) NAVEGACIÓN Y TOGGLE OBRA
       ========================================================= */
    function mostrarSeccion(id) {
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
        const seccionActiva = document.getElementById(id);
        if (seccionActiva) seccionActiva.classList.add('activa');

        document.querySelectorAll('.nav-text').forEach(b => b.classList.remove('activo'));
        const btn = document.getElementById('btn-' + id);
        if (btn) btn.classList.add('activo');
    }

    function toggleObra(btn) {
        const contenedor = btn.nextElementSibling;
        if (!contenedor || !contenedor.classList.contains('marco-contenedor')) return;

        contenedor.classList.toggle('abierto');
        bookOpen = contenedor.classList.contains('abierto');
        btn.textContent = bookOpen
            ? i18n[currentLang].book_button_open
            : i18n[currentLang].book_button;
    }

    /* =========================================================
       4) VISOR PDF INLINE (con PDF.js, render en canvas)
          - Sin capa de texto => no se puede seleccionar ni copiar
          - Se muestra dentro de la propia página
       ========================================================= */
    let pdfLoaded = false;
    let pdfLoading = false;

    async function mostrarPDF() {
        const container = document.getElementById('pdf-viewer-container');
        const scrollArea = document.getElementById('pdf-scroll');
        const statusEl = document.getElementById('pdf-status');

        // Mostrar el contenedor
        container.classList.add('visible');
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });

        if (pdfLoaded || pdfLoading) return;

        if (!window.pdfjsLib) {
            statusEl.textContent = i18n[currentLang].pdf_error;
            statusEl.classList.add('pdf-error');
            return;
        }

        pdfLoading = true;
        statusEl.textContent = i18n[currentLang].pdf_loading;

        try {
            const loadingTask = pdfjsLib.getDocument('pdf/Desobediencia.pdf');
            const pdf = await loadingTask.promise;

            // Limpiar estado
            scrollArea.innerHTML = '';

            const outputScale = window.devicePixelRatio || 1;

            for (let num = 1; num <= pdf.numPages; num++) {
                const page = await pdf.getPage(num);
                const viewport = page.getViewport({ scale: 1.5 });

                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page';
                const ctx = canvas.getContext('2d');

                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);

                const transform = outputScale !== 1
                    ? [outputScale, 0, 0, outputScale, 0, 0]
                    : null;

                scrollArea.appendChild(canvas);

                await page.render({
                    canvasContext: ctx,
                    viewport: viewport,
                    transform: transform
                }).promise;
            }

            pdfLoaded = true;
        } catch (err) {
            console.error('Error cargando el PDF:', err);
            scrollArea.innerHTML =
                '<div class="pdf-status pdf-error">' +
                i18n[currentLang].pdf_error +
                '</div>';
        } finally {
            pdfLoading = false;
        }
    }

    /* =========================================================
       5) CARGA INICIAL
       ========================================================= */
    window.addEventListener('DOMContentLoaded', function () {
        // Idioma guardado
        let savedLang = 'es';
        try { savedLang = localStorage.getItem('lang') || 'es'; } catch (e) {}
        applyLanguage(savedLang);

        // Logo (con fallback a distintas extensiones)
        function cargarImagen(idImg, nombre) {
            const img = document.getElementById(idImg);
            if (!img) return;
            const extensiones = ['.png', '.jpg', '.jpeg', '.webp'];
            let i = 0;
            function intentar() {
                if (i >= extensiones.length) {
                    img.alt = 'Imagen no disponible: ' + nombre;
                    return;
                }
                img.src = 'img/' + nombre + extensiones[i];
                img.onerror = () => { i++; intentar(); };
            }
            intentar();
        }
        cargarImagen('logo-home', 'Home');

        // Protección adicional contra copia en el visor
        const scroller = document.getElementById('pdf-scroll');
        if (scroller) {
            scroller.addEventListener('copy', e => e.preventDefault());
            scroller.addEventListener('cut', e => e.preventDefault());
            scroller.addEventListener('dragstart', e => e.preventDefault());
            scroller.addEventListener('selectstart', e => e.preventDefault());
        }
    });
    </script>
</body>
</html>
