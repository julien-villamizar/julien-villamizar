    <style>
        body {
            margin: 0;
            font-family: 'Lora', serif;
            background: #000000;
            color: #ffffff;
            padding-top: 70px;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #000000;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            z-index: 1000;
            border-bottom: 1px solid #222;
            box-sizing: border-box;
        }
        .nav-text {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
            padding: 5px 0;
            font-family: 'Cinzel', serif;
        }
        .nav-text:hover,
        .nav-text.activo { color: #F5C84C; }

        /* === SELECTOR DE IDIOMA === */
        .lang-switcher {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1100;
        }
        .lang-main {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(245,200,76,0.15), rgba(0,0,0,0.9));
            border: 2px solid #F5C84C;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            box-shadow:
                0 0 15px rgba(245,200,76,0.3),
                inset 0 0 12px rgba(245,200,76,0.15);
            padding: 0;
        }
        .lang-main:hover {
            transform: scale(1.08);
            box-shadow:
                0 0 28px rgba(245,200,76,0.7),
                inset 0 0 18px rgba(245,200,76,0.3);
        }
        .lang-main .globe {
            width: 24px;
            height: 24px;
            stroke: #F5C84C;
            fill: none;
            transition: transform 0.5s ease;
        }
        .lang-switcher.open .lang-main .globe { transform: rotate(180deg); }

        .lang-options {
            position: absolute;
            top: 58px;
            right: 0;
            background: rgba(8,8,8,0.98);
            border: 2px solid #F5C84C;
            border-radius: 14px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-12px) scale(0.95);
            transform-origin: top right;
            transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s;
            box-shadow:
                0 12px 40px rgba(0,0,0,0.9),
                0 0 40px rgba(245,200,76,0.18);
            min-width: 210px;
            backdrop-filter: blur(6px);
        }
        .lang-switcher.open .lang-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .lang-option {
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            border: 1px solid transparent;
            color: #ddd;
            padding: 10px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
        .lang-option:hover {
            background: rgba(245,200,76,0.12);
            border-color: rgba(245,200,76,0.4);
            color: #F5C84C;
            transform: translateX(-3px);
        }
        .lang-option.active {
            background: rgba(245,200,76,0.18);
            border-color: #F5C84C;
            color: #F5C84C;
            box-shadow: inset 0 0 12px rgba(245,200,76,0.2);
        }
        .lang-option .globe-sm {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            flex-shrink: 0;
            transition: stroke 0.2s;
        }
        .lang-option.active .globe-sm,
        .lang-option:hover .globe-sm { stroke: #F5C84C; }

        .seccion {
            display: none;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .seccion.activa { display: block; }

        .cabecera { text-align: center; }
        .cabecera img {
            width: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #F5C84C;
            box-shadow: 0 0 20px rgba(245, 200, 76, 0.2);
        }
        .cabecera h1 {
            margin: 0 0 10px;
            font-size: 2.8em;
            font-family: 'Cinzel', serif;
            color: #F5C84C;
            text-shadow: 0 0 30px rgba(245, 200, 76, 0.15);
            letter-spacing: 3px;
        }
        .cabecera .bio {
            margin-top: 30px;
            white-space: pre-line;
            line-height: 1.9;
            display: inline-block;
            text-align: center;
            font-family: 'Lora', serif;
            color: #ddd;
            max-width: 700px;
            font-size: 1.05rem;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #000000;
            color: #ffffff;
            margin-top: 60px;
            border-top: 1px solid #222;
            font-family: 'Lora', serif;
            font-size: 0.9rem;
        }

        .libros-lista { padding: 10px 0; }
        .obra-item {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            padding: 18px 25px;
            background: transparent;
            border: 2px solid #F5C84C;
            border-radius: 4px;
            color: #F5C84C;
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: rgba(0,0,0,0.3);
            text-align: center;
            box-shadow: 0 0 20px rgba(245, 200, 76, 0.05);
        }
        .obra-item:hover {
            background: #F5C84C;
            color: #000;
            box-shadow: 0 0 40px rgba(245, 200, 76, 0.2);
            transform: scale(1.02);
        }

        .marco-contenedor {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s ease, opacity 0.4s ease, margin 0.3s ease;
            opacity: 0;
            margin: 0 auto;
        }
        .marco-contenedor.abierto {
            max-height: 8000px;
            opacity: 1;
            margin: 30px auto;
        }

        .marco-antiguo {
            position: relative;
            background: #0a0a0a;
            border: 8px double #F5C84C;
            border-radius: 20px 5px 20px 5px;
            padding: 40px 35px;
            max-width: 650px;
            margin: 0 auto;
            box-shadow:
                inset 0 0 60px rgba(0,0,0,0.8),
                0 0 30px rgba(245, 200, 76, 0.1),
                0 10px 40px rgba(0,0,0,0.9);
        }
        .marco-antiguo::before,
        .marco-antiguo::after {
            content: "ᛉ";
            position: absolute;
            font-size: 2.8rem;
            color: #F5C84C;
            opacity: 0.3;
            font-family: 'MedievalSharp', cursive;
            text-shadow: 0 0 15px rgba(245, 200, 76, 0.1);
        }
        .marco-antiguo::before { top: -15px; left: 20px; }
        .marco-antiguo::after { bottom: -15px; right: 20px; }

        .marco-antiguo .runas {
            position: absolute;
            font-family: 'MedievalSharp', cursive;
            color: #F5C84C;
            font-size: 1.3rem;
            opacity: 0.2;
            pointer-events: none;
        }
        .marco-antiguo .runas.r1 { top: 15px; right: 25px; }
        .marco-antiguo .runas.r2 { bottom: 15px; left: 25px; }
        .marco-antiguo .runas.r3 { top: 50%; left: 10px; transform: translateY(-50%); }
        .marco-antiguo .runas.r4 { top: 50%; right: 10px; transform: translateY(-50%); }

        .obra-titulo {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: #F5C84C;
            text-shadow: 0 0 30px rgba(245, 200, 76, 0.1);
            margin: 10px 0 5px;
            letter-spacing: 8px;
            word-break: break-word;
        }
        .obra-autor {
            font-family: 'Lora', serif;
            font-size: 1.4rem;
            color: #ccc;
            margin-bottom: 20px;
            font-style: italic;
            letter-spacing: 1px;
        }
        .obra-fecha {
            font-family: 'Lora', serif;
            font-size: 1rem;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .obra-dedicatoria {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            color: #ddd;
            font-style: italic;
            line-height: 1.6;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 18px 0;
            margin: 20px 0;
            white-space: pre-line;
        }
        .obra-info {
            font-family: 'Lora', serif;
            font-size: 1rem;
            color: #bbb;
            line-height: 1.8;
            margin: 20px 0 30px;
            background: rgba(0,0,0,0.4);
            padding: 18px;
            border-radius: 8px;
            border-left: 3px solid #F5C84C;
            border-right: 3px solid #F5C84C;
            white-space: pre-line;
        }
        .obra-info strong { color: #F5C84C; font-weight: 700; }
        .obra-info .nota { font-style: italic; color: #999; }

        /* Aviso de idioma del PDF */
        .pdf-lang-warning {
            display: block;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed #444;
            font-style: italic;
            color: #F5C84C;
            font-size: 0.92rem;
            letter-spacing: 0.5px;
        }
        .pdf-lang-warning::before {
            content: "⚠ ";
            color: #F5C84C;
        }

        .btn-pdf {
            display: inline-block;
            background: transparent;
            color: #F5C84C;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 40px;
            border: 2px solid #F5C84C;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(245, 200, 76, 0.05);
            position: relative;
            cursor: pointer;
            background-color: rgba(0,0,0,0.3);
        }
        .btn-pdf:hover {
            background: #F5C84C;
            color: #000;
            box-shadow: 0 0 40px rgba(245, 200, 76, 0.2);
            transform: scale(1.02);
        }
        .btn-pdf::before {
            content: "";
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 2px solid #333;
            border-radius: 6px;
            opacity: 0.3;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .btn-pdf:hover::before { opacity: 0.8; }

        .pdf-viewer-container {
            display: none;
            margin: 30px auto 0;
            padding: 0;
            max-width: 720px;
        }
        .pdf-viewer-container.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .pdf-scroll-area {
            max-height: 80vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px 10px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            scrollbar-width: thin;
            scrollbar-color: #F5C84C #1a1a1a;
        }
        .pdf-scroll-area::-webkit-scrollbar { width: 8px; }
        .pdf-scroll-area::-webkit-scrollbar-track { background: #1a1a1a; }
        .pdf-scroll-area::-webkit-scrollbar-thumb { background: #F5C84C; border-radius: 4px; }
        .pdf-page {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-width: 100%;
            margin: 15px auto;
            border: 1px solid #333;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            pointer-events: none;
        }
        .pdf-status {
            color: #F5C84C;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            text-align: center;
            padding: 30px 0;
            font-size: 1rem;
        }
        .pdf-error { color: #ff6b6b; }

        @media (max-width: 600px) {
            .obra-titulo { font-size: 2.2rem; letter-spacing: 4px; }
            .marco-antiguo { padding: 25px 15px; }
            .btn-pdf { font-size: 0.9rem; padding: 12px 25px; letter-spacing: 2px; }
            .marco-antiguo::before,
            .marco-antiguo::after { font-size: 2rem; }
            .marco-antiguo .runas { display: none; }
            .obra-item { font-size: 1rem; padding: 14px 20px; }
            nav { gap: 20px; }
            .lang-switcher { right: 10px; }
            .lang-main { width: 40px; height: 40px; }
            .lang-main .globe { width: 20px; height: 20px; }
            .lang-options { min-width: 190px; }
            .lang-option { font-size: 0.82rem; padding: 9px 12px; }
        }
    </style>
</head>
<body>
    <nav>
        <button class="nav-text activo" id="btn-home" onclick="mostrarSeccion('home')" data-i18n="nav_home">Inicio</button>
        <button class="nav-text" id="btn-books" onclick="mostrarSeccion('books')" data-i18n="nav_books">Libros</button>

        <div class="lang-switcher" id="lang-switcher">
            <button class="lang-main" id="lang-main" aria-label="Cambiar idioma" title="Cambiar idioma">
                <svg class="globe" viewBox="0 0 24 24" stroke-width="1.6">
                    <circle cx="12" cy="12" r="9"/>
                    <ellipse cx="12" cy="12" rx="4" ry="9"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>

            <div class="lang-options" id="lang-options" role="menu">
                <button class="lang-option" data-lang="en" role="menuitem">
                    <svg class="globe-sm" viewBox="0 0 24 24" stroke-width="1.6">
                        <circle cx="12" cy="12" r="9"/>
                        <ellipse cx="12" cy="12" rx="4" ry="9"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="4.5" y1="7" x2="19.5" y2="7"/>
                        <line x1="4.5" y1="17" x2="19.5" y2="17"/>
                    </svg>
                    <span>English</span>
                </button>
                <button class="lang-option" data-lang="fr" role="menuitem">
                    <svg class="globe-sm" viewBox="0 0 24 24" stroke-width="1.6">
                        <circle cx="12" cy="12" r="9"/>
                        <ellipse cx="12" cy="12" rx="4" ry="9"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="4.5" y1="7" x2="19.5" y2="7"/>
                        <line x1="4.5" y1="17" x2="19.5" y2="17"/>
                    </svg>
                    <span>Français</span>
                </button>
                <button class="lang-option" data-lang="es" role="menuitem">
                    <svg class="globe-sm" viewBox="0 0 24 24" stroke-width="1.6">
                        <circle cx="12" cy="12" r="9"/>
                        <ellipse cx="12" cy="12" rx="4" ry="9"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="4.5" y1="7" x2="19.5" y2="7"/>
                        <line x1="4.5" y1="17" x2="19.5" y2="17"/>
                    </svg>
                    <span>Español</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="home" class="seccion activa">
        <div class="cabecera">
            <img id="logo-home" alt="Logo de Julien Villamizar" src="">
            <h1>Julien Villamizar Arriaga</h1>
            <div class="bio" data-i18n="bio"></div>
        </div>
    </div>

    <div id="books" class="seccion">
        <div class="libros-lista">
            <button class="obra-item" id="book-toggle" onclick="toggleObra(this)" data-i18n="book_button">Primer intento</button>

            <div class="marco-contenedor" id="obra-desobediencia">
                <div class="marco-antiguo">
                    <span class="runas r1">ᛉ ᚨ</span>
                    <span class="runas r2">ᚠ ᛗ</span>
                    <span class="runas r3">ᚢ</span>
                    <span class="runas r4">ᛏ</span>

                    <div class="obra-titulo" data-i18n="book_title">DESOBEDIENCIA</div>
                    <div class="obra-autor">Julien Villamizar Arriaga</div>
                    <div class="obra-fecha" data-i18n="book_date">Noviembre de 2025</div>

                    <div class="obra-dedicatoria" data-i18n="dedication"></div>

                    <div class="obra-info" data-i18n="book_info"></div>

                    <button class="btn-pdf" id="btn-read" onclick="mostrarPDF()" data-i18n="btn_read">Leer la historia</button>

                    <div class="pdf-viewer-container" id="pdf-viewer-container">
                        <div class="pdf-scroll-area" id="pdf-scroll" oncontextmenu="return false;">
                            <div class="pdf-status" id="pdf-status" data-i18n="pdf_loading">Cargando…</div>

                    </div>
                </div>
            </div>
        </div>

    <footer>
        <p data-i18n="footer">© 2026 Julien Villamizar Arriaga. Todos los derechos reservados.</p>
    </footer>

    <script>
    /* =========================================================
       DICCIONARIO
       ========================================================= */
    const i18n = {
        es: {
            nav_home: 'Inicio',
            nav_books: 'Libros',
            bio: `Crecí entre montañas verdes, calles ruidosas y un idioma que baila cuando se habla.
De niño, el olor de la tierra húmeda me enseñó más que cualquier salón de clases.
No me gustaba leer: los libros me parecían jaulas de letras que no me pertenecían.
Hasta que un cómic cayó en mis manos como un rayo sobre tierra fértil.
Sus viñetas me revelaron que una historia podía respirar, sudar, gritar.
Comencé a leer sin descanso: primero cómics, luego novelas delgadas, más tarde ladrillos de páginas.
Cada lectura era una ventana rota a un mundo que tenía que habitar.
A los doce años, en una noche de insomnio, soñé despierto con escribir mi propio libro.
Ese sueño no se desvaneció al amanecer; se quedó a vivir conmigo.
A los catorce tomé la decisión más solemne de mi vida: convertirme en escritor.
No fue un capricho juvenil, sino un pacto íntimo con mi propia voz.
Empecé a escribir en cuadernos, en servilletas, en los márgenes de los libros de la escuela.
Cada frase torpe era una prueba; cada error, una lección que sabía a victoria.
Hoy, a los dieciocho años, soy un chico que escribe desde la honestidad radical.
Mi tierra no es solo un escenario: es el pulso que le pongo a cada personaje.
Escribo para tender puentes donde antes solo había silencio y distancia.
Escribo para que otros, al leerme, sientan que alguien los entiende sin juzgarlos.
No busco la perfección; busco la verdad que se esconde bajo la piel de las palabras.
Cada historia que comienzo es una forma de abrazar el caos y transformarlo en algo hermoso.
Mi vida es la página en la que aprendo a ser humano, línea por línea.`,
            book_button: 'Primer intento',
            book_button_open: 'Primer intento ▲',
            book_title: 'DESOBEDIENCIA',
            book_date: 'Noviembre de 2025',
            dedication: `"A mi madre, mi guerrera sin armadura,
que me enseñó que los sueños valen la pena."`,
            book_info: `<strong>Este es un borrador en proceso de revisión.</strong>
Forma parte de la antología «Herencias Invisibles»,
que será publicada por <strong>Ita Editorial</strong>.
<span class="nota">Cualquier comentario o sugerencia es bienvenido.</span>
<span class="pdf-lang-warning">El texto solo está disponible en español.</span>`,
            btn_read: 'Leer la historia',
            footer: '© 2026 Julien Villamizar Arriaga. Todos los derechos reservados.',
            pdf_loading: 'Cargando…',
            pdf_error: 'No se pudo cargar el PDF.'
        },
        en: {
            nav_home: 'Home',
            nav_books: 'Books',
            bio: `I grew up amongst green mountains, noisy streets and a language that dances when spoken.
As a child, the smell of damp earth taught me more than any classroom ever did.
I didn't like reading: books struck me as cages made of letters that didn't belong to me.

    /* =========================================================
       APLICAR IDIOMA
       ========================================================= */
    let currentLang = 'es';
    let bookOpen = false;

    function applyLanguage(lang) {
        if (!i18n[lang]) lang = 'es';
        currentLang = lang;
        const dict = i18n[lang];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (dict[key] !== undefined) el.innerHTML = dict[key];
        });

        document.querySelectorAll('.lang-option').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        document.documentElement.lang = lang;
        try { localStorage.setItem('lang', lang); } catch (e) {}

        const btn = document.getElementById('book-toggle');
        if (btn) btn.textContent = bookOpen ? dict.book_button_open : dict.book_button;

        const metaDesc = document.querySelector('meta[name="description"]');
        const metaOgDesc = document.querySelector('meta[property="og:description"]');
        const desc = lang === 'es'
            ? 'Te doy la bienvenida a mi portafolio personal, donde comparto mi música, mis videojuegos y mis libros.'
            : lang === 'en'
                ? 'Welcome to my personal portfolio, where I share my music, my video games, and my books.'
                : 'Bienvenue sur mon portfolio personnel, où je partage ma musique, mes jeux vidéo et mes livres.';
        if (metaDesc) metaDesc.setAttribute('content', desc);
        if (metaOgDesc) metaOgDesc.setAttribute('content', desc);
    }

    /* =========================================================
       SELECTOR DE IDIOMA
       ========================================================= */
    const langSwitcher = document.getElementById('lang-switcher');
    const langMain = document.getElementById('lang-main');

    langMain.addEventListener('click', (e) => {
        e.stopPropagation();
        langSwitcher.classList.toggle('open');
    });

    document.querySelectorAll('.lang-option').forEach(btn => {
        btn.addEventListener('click', () => {
            applyLanguage(btn.dataset.lang);
            langSwitcher.classList.remove('open');
        });
    });

    document.addEventListener('click', (e) => {
        if (!langSwitcher.contains(e.target)) langSwitcher.classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') langSwitcher.classList.remove('open');
    });

    /* =========================================================
       NAVEGACIÓN Y TOGGLE
       ========================================================= */
    function mostrarSeccion(id) {
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
        const seccionActiva = document.getElementById(id);
        if (seccionActiva) seccionActiva.classList.add('activa');

        document.querySelectorAll('.nav-text').forEach(b => b.classList.remove('activo'));
        const btn = document.getElementById('btn-' + id);
        if (btn) btn.classList.add('activo');
    }

    function toggleObra(btn) {
        const contenedor = btn.nextElementSibling;
        if (!contenedor || !contenedor.classList.contains('marco-contenedor')) return;
        contenedor.classList.toggle('abierto');
        bookOpen = contenedor.classList.contains('abierto');
        btn.textContent = bookOpen
            ? i18n[currentLang].book_button_open
            : i18n[currentLang].book_button;
    }

    /* =========================================================
       VISOR PDF INLINE
       ========================================================= */
    let pdfLoaded = false;
    let pdfLoading = false;

    async function mostrarPDF() {
        const container = document.getElementById('pdf-viewer-container');
        const scrollArea = document.getElementById('pdf-scroll');
        const statusEl = document.getElementById('pdf-status');

        container.classList.add('visible');
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });

        if (pdfLoaded || pdfLoading) return;

        if (!window.pdfjsLib) {
            statusEl.textContent = i18n[currentLang].pdf_error;
            statusEl.classList.add('pdf-error');
            return;
        }

        pdfLoading = true;
        statusEl.textContent = i18n[currentLang].pdf_loading;

        try {
            const loadingTask = pdfjsLib.getDocument('pdf/Desobediencia.pdf');
            const pdf = await loadingTask.promise;

            scrollArea.innerHTML = '';
            const outputScale = window.devicePixelRatio || 1;

            for (let num = 1; num <= pdf.numPages; num++) {
                const page = await pdf.getPage(num);
                const viewport = page.getViewport({ scale: 1.5 });

                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-page';
                const ctx = canvas.getContext('2d');

                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);

                const transform = outputScale !== 1
                    ? [outputScale, 0, 0, outputScale, 0, 0]
                    : null;

                scrollArea.appendChild(canvas);

                await page.render({
                    canvasContext: ctx,
                    viewport: viewport,
                    transform: transform
                }).promise;
            }

            pdfLoaded = true;
        } catch (err) {
            console.error('Error cargando el PDF:', err);
            scrollArea.innerHTML =
                '<div class="pdf-status pdf-error">' +
                i18n[currentLang].pdf_error +
                '</div>';
        } finally {
            pdfLoading = false;
        }
    }

    /* =========================================================
       INICIO
       ========================================================= */
    window.addEventListener('DOMContentLoaded', function () {
        let savedLang = 'es';
        try { savedLang = localStorage.getItem('lang') || 'es'; } catch (e) {}
        applyLanguage(savedLang);

        function cargarImagen(idImg, nombre) {
            const img = document.getElementById(idImg);
            if (!img) return;
            const extensiones = ['.png', '.jpg', '.jpeg', '.webp'];
            let i = 0;
            function intentar() {
                if (i >= extensiones.length) {
                    img.alt = 'Imagen no disponible: ' + nombre;
                    return;
                }
                img.src = 'img/' + nombre + extensiones[i];
                img.onerror = () => { i++; intentar(); };
            }
            intentar();
        }
        cargarImagen('logo-home', 'Home');

        const scroller = document.getElementById('pdf-scroll');
        if (scroller) {
            scroller.addEventListener('copy', e => e.preventDefault());
            scroller.addEventListener('cut', e => e.preventDefault());
            scroller.addEventListener('dragstart', e => e.preventDefault());
            scroller.addEventListener('selectstart', e => e.preventDefault());
        }
    });
    </script>
